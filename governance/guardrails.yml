# =============================================================================
# A CHECK DERIVES FROM THIS FILE'S STRUCTURE.
# tests/plain_language_check.py builds its registry of what each code means by
# reading `defaults:` and each entry's `id`, `name` and `statement`. Change
# those key names or that nesting and the derivation fails loudly, naming this
# file - it does not fall back to a hand-written table, because a table would
# drift from this file in silence. See TRC-C9 in plain-language-3-2-0.
# =============================================================================
# Compass - guardrails.yml
# =============================================================================
# THE MACHINE-READABLE GUARDRAIL DEFINITIONS. This file is authoritative for
# how guardrails are *checked*. `guardrails.md` explains what each guardrail is
# and why; this file says what evidence clears it, and `compass check` runs
# those checks against an issue's `task.yml` and `evidence/`.
#
# Note the asymmetry, and that it is deliberate: GUARDRAILS get a .yml because
# they are checkable. STRATEGIES do not - `strategies.md` stays prose-only,
# because a strategy is *assessed* (the reviewer's judgement), not *checked*.
# That asymmetry is the guardrail/strategy distinction made physical: if a
# thing can be given a named, mechanical check, it can be a guardrail; if it
# can only be judged, it is a strategy.
#
# The five default guardrails below ship active. A project may ADD guardrails
# under `project:` - each needs a named check, or it is a strategy, not a
# guardrail. `compass policy lint` validates this file against
# schemas/guardrails.schema.json.
# =============================================================================

version: 1.10.1
# -----------------------------------------------------------------------------
# Named checks - the mechanical checks `compass check` knows how to run. Each
# guardrail below references one or more of these by name. The check reads
# task.yml and evidence/ - it does not re-run tests (that is tdd-green's job);
# it verifies the recorded state is coherent and backed by evidence.
# -----------------------------------------------------------------------------
checks:
  scenarios-have-tests:
    description: "Every scenario in task.yml lists at least one test."
  scenarios-are-executable:
    description: "Every scenario in task.yml was accounted for by the project's BDD runner. Reads the record `compass bdd verify` writes; never runs the suite. No-ops when project.bdd_runner is unset."
    # Reading-scoped, exactly like a guardrail's `applies_when:`.
    # Below this threshold a finding is reported without failing the
    # run - most projects have wired no runner, and an advisory
    # finding is the honest default (ADR-006).
    blocking_when: { blast_radius: [cross-cutting, critical] }
  declared-tests-resolve:
    description: "Every declared test id points at a test that exists on disk. Fires only once an issue has claimed verify.correctness and is still active - before that the test legitimately does not exist yet; after landing the spine is a historical record."
  suite-passed:
    description: >
      A green record on file shows the full suite passing, recently. The
      record is named by its binding - evidence/green-<scenario>.json when
      bound, evidence/green.json when not - and the registry entry names
      whichever was written.
  changed-code-traces-to-scenario:
    description: "Every changed production file maps to >=1 scenario id."
  scenario-has-id-and-intent:
    description: "Every scenario has a stable id and a linked intent id."
  claim-traces-to-scenario:
    description: >
      Every claim maps to a scenario id that exists. TRACEABILITY, NOT TRUTH -
      and this check is the one in the set whose name promises less than a
      reader hears. It confirms a claim points at something. It cannot confirm
      that what the claim says is so, and no machine can. A claim reading "7 em
      dashes repaired to zero" traced correctly to its scenario and was false:
      the file had never contained one. Passing means "this is traceable"; a
      reader will hear "this is verified". Every other check here means roughly
      what it sounds like, which is exactly why this one needs saying. What
      catches a false claim is the reviewer at verify.claims, reading it against
      the scenario it points at - a person, not this check.
  gate-evidence-present:
    description: "Every gate marked pass has an evidence pointer that resolves."
  human-approval-present:
    description: "An approval record exists for an irreversible change."
  backfills-paid:
    description: "The issue spine's follow-ups list is empty or every item is resolved."
  spike-conclusion-present:
    description: "A spike has a `spike-conclusion` evidence entry with a recorded decision (discard | graduate-to-delivery | defer); graduate-to-delivery links the next issue."
  spike-no-production-changes:
    description: "A Spike's `changed_files` is empty - a spike ships nothing; graduating to delivery is a fresh triage, not a merge."
  dod-evidence-typed:
    description: >
      Every unchecked DoD box in verification-report.md must carry an inline
      tag: `(evidence: EV-<id>)` referencing a typed evidence registry entry,
      or `(follow-up: FU-<id>)` referencing an outstanding follow-up. A bare unchecked
      box fails. Checked boxes (`- [x]`) pass without a tag - the human took
      responsibility. Narrative notes (devlog 'USER TO APPLY') never count.
      Cross-issue: when another issue has a follow-up with target_task pointing at
      this issue, that follow-up must be resolved before this issue ships.
  coherence-check-passes:
    description: "compass analyze reports zero coherence findings. Gate-clearing runs write type coherence-check evidence; advisory runs write command-output and do not clear verify.analyze."
  no-trusted-rerun:
    description: >
      Every test-run evidence entry is checked for rerun integrity. A record
      with rerun_without_change: true must have its test listed in the project
      quarantine registry (governance/quarantine.yml) with a tracking issue - a
      rerun-to-green without a quarantine entry is a G4 failure (S5: intermittency
      is failure). A record with attempts > 1 but no rerun_without_change marker
      is also rejected - incomplete evidence cannot clear G4. Old evidence without
      an attempts field passes trivially (backward compat, TRC-A5). May carry
      attempts: <int> and rerun_without_change: <bool> to signal rerun integrity
      (see strategy S5).
  evidence-identity-matches:
    description: >
      Every registry entry still names the record it was created from. Records
      are stamped at write time with a `record_id` (unique per write) and a
      `content_digest` (over the payload); the entry stores both. A different
      record_id means the file was replaced after it was cited; a matching
      record_id with a different digest means it was edited in place. An entry
      with no record_id predates stamping and is UNVERIFIABLE - reported and
      counted apart from the passes, never treated as verified, because an
      unstamped record cannot be checked against its citation.

  command-passes:
    description: "Runs the project guardrail's declared `command:` via subprocess and checks it exits 0. On success: emits a command-output evidence entry. On failure: emits a command-output evidence entry with exit code + stderr. When verify.fitness is in the gate set and zero project guardrails declare command-passes, it passes without checking anything (no declarations means there are no fitness functions to run)."

# -----------------------------------------------------------------------------
# Evidence types - what KINDS of evidence a gate can be cleared with. Without
# this, `gate-evidence-present` is circular: a gate could be marked `pass`
# pointing at a weak markdown note and still clear the mechanical check. Typing
# the evidence makes the *strength* of a gate's backing visible - and lets the
# checker demand a real mechanical capture for the gates that need one.
#
# Evidence model: task.yml has a top-level `evidence:` REGISTRY of typed
# entries (each {id, type, path, ...}); a gate's `evidence:` is a list of
# evidence ids referencing the registry. Multiple gates can share one entry.
# -----------------------------------------------------------------------------
evidence_types:
  test-run:
    description: >
      A recorded test execution - e.g. evidence/green-<scenario>.json from a
      scenario-bound `compass tdd-green`, or evidence/green.json from an
      unbound one.
      The strongest: a machine ran it. May carry attempts: <int> and
      rerun_without_change: <bool> to signal rerun integrity (see strategy S5 and
      the no-trusted-rerun check).
  command-output:
    description: "Captured output of a command - a scanner, a linter, a coverage run, a `compass check` run."
  manual-review:
    description: "A recorded reviewer judgement - a code review or governance review captured in a file. Stronger than a generic artifact because it is a named review, not a stray note."
  human-approval:
    description: "A recorded human sign-off - for irreversible changes (guardrail G5). Has structured fields: approver, role, decision, timestamp, scope, conditions."
  security-review:
    description: "A recorded security review or scan result - for security-sensitive changes."
  migration-plan:
    description: "A recorded plan for a data, schema, or infrastructure migration."
  rollback-plan:
    description: "A recorded plan for reverting a change safely if it goes wrong."
  claim-review:
    description: "A recorded review of public/user-facing claims against backing scenarios - the marketer's audit trail."
  spike-conclusion:
    description: "A recorded close-out of a spike: what was learned, a decision (discard | graduate-to-delivery | defer), and any link to the next issue."
  coherence-check:
    description: "Output of compass analyze - a structured coherence findings list. Gate-clearing: zero findings. Only this type clears verify.analyze; advisory command-output entries do not."
  artifact:
    description: "A written record without a more specific type - a review note, a verification report. The weakest, by design: honest for judgement-shaped gates, never enough for a mechanical one."

# gate_evidence_requirements - which evidence types each gate will accept. A
# gate not listed here accepts any type. The point is the constrained ones:
# you cannot clear `verify.correctness` with a markdown note, because
# correctness is a mechanical fact and demands a `test-run`.
gate_evidence_requirements:
  verify.correctness: [test-run]
  verify.regression: [test-run]
  verify.security: [security-review, command-output, test-run]
  verify.governance: [command-output, manual-review, artifact]
  verify.traceability: [command-output, artifact]
  verify.claims: [claim-review, command-output, artifact]
  verify.clarity: [manual-review, artifact]       # inherently judgement - and now visibly so
  spike.conclude: [spike-conclusion]              # SPECIFIC: a generic artifact will not do
  verify.analyze: [coherence-check]              # SPECIFIC: advisory command-output does NOT clear this gate
  verify.fitness: [test-run, command-output]    # fitness checks: command-output from command-passes, or a test-run

# -----------------------------------------------------------------------------
# DEFAULT GUARDRAILS - G1–G5. Shipped active. The floor under every route.
# -----------------------------------------------------------------------------
defaults:

  - id: G1
    name: "Tested before it lands"
    statement: >
      No code reaches main unless it traces to a declared test and a green test run is on record.
      Compass checks that both exist and line up; it does not observe the declared test running - see docs/safety-contract.md for what a test-run record does and does not establish.
    # The red-before-green ritual is strategy S2, not this guardrail. G1 is the
    # outcome; `compass check` verifies the outcome, the hook enforces S2.
    # `declared-tests-resolve` closes the gap that a test being *named* is not
    # the same as a test existing. It fires only once an issue has claimed
    # verify.correctness and is still active - before that the test legitimately
    # does not exist yet, and after landing the spine is a historical record.
    checks: [scenarios-have-tests, declared-tests-resolve, suite-passed,
             changed-code-traces-to-scenario, scenarios-are-executable]
    checked_at: [verify, land]

  - id: G2
    name: "Acceptance defined before it is built"
    statement: >
      No code is written that no stated, checkable acceptance criterion
      describes. BDD scenarios (strategy S1) are the default form.
    checks: [scenario-has-id-and-intent]
    checked_at: [clarify, verify]

  - id: G3
    name: "Traceability holds"
    statement: >
      code -> acceptance criterion -> intent, and public claim -> criterion,
      maintained continuously.
    checks: [changed-code-traces-to-scenario, scenario-has-id-and-intent, claim-traces-to-scenario]
    checked_at: [clarify, build, verify, land]

  - id: G4
    name: "Evidence, not assertion"
    statement: >
      A guardrail is cleared with artifacts and command output, never a claim.
      The Definition of Done is a typed gate: every unchecked DoD box must
      reference typed evidence or a filed follow-up - narrative notes never clear it.
    checks: [gate-evidence-present, dod-evidence-typed, coherence-check-passes, no-trusted-rerun, command-passes,
             evidence-identity-matches]
    checked_at: [verify, land]

  - id: G5
    name: "A human signs off on the irreversible"
    statement: >
      A change that can lose data, move money, or breach auth or privacy gets
      an explicit human checkpoint before it lands.
    checks: [human-approval-present]
    # Fires on either arm, because the statement above names CONSEQUENCES while
    # a tag list names domains, and those are not the same set. A change that
    # can lose data - a backup/restore path, a destructive cleanup job, a
    # retention policy, a storage migration written in application code - may
    # carry none of the four tags and still be exactly what this guardrail is
    # for. `critical` is defined in the router rubric as "can this lose data,
    # lose money, breach auth/privacy, or resist a clean rollback": the same
    # four consequences. The definitions already agreed; only the trigger did
    # not. The routing policy floors both arms heavily, so the checkpoint has a
    # home either way.
    applies_when:
      any_of:
        - touches_any: [auth, payments, personal-data, migrations]
        - blast_radius: critical
    checked_at: [land]

# -----------------------------------------------------------------------------
# SPIKE GUARDRAILS - apply only on a spike. A spike is intentionally
# free of the delivery guardrails (G1-G5 do not apply), but it is still
# CONTROLLED: it must conclude, and it must not silently produce production
# work. `compass check` runs these instead of the defaults on a spike.
# -----------------------------------------------------------------------------
spike_guardrails:

  - id: S1
    name: "Spike conclusion recorded"
    statement: >
      A Spike must record what it learned and a close-out decision: discard
      the work, graduate to delivery, or defer. Without a recorded conclusion
      a Spike is just untracked work.
    checks: [spike-conclusion-present]
    checked_at: [land]

  - id: S2
    name: "No production change from a Spike"
    statement: >
      A Spike ships nothing - its `changed_files` must be empty. Exploration
      code lives on a scratch branch; if the finding is acted on, a fresh
      triage owns the code under a real route's guardrails. This is the safety
      model: a Spike cannot silently become delivery.
    checks: [spike-no-production-changes]
    checked_at: [land]

# -----------------------------------------------------------------------------
# PROJECT GUARDRAILS - the team adds here. Each MUST reference a named check
# (add new checks to `checks:` above, or ask the CLI maintainer to add the
# check logic). A would-be guardrail with no mechanical check is a strategy -
# put it in strategies.md instead. Leave this empty rather than padding it.
# -----------------------------------------------------------------------------
project: []
# Empty on purpose, not by oversight: the framework ships no project guardrails,
# so an adopting repo sees no project-level check until it declares one.
#  - id: Q1
#    name: "Coverage floor"
#    statement: "Line coverage does not drop below 80%."
#    checks: [coverage-floor]          # <- a project-added check
#    params: { min_line_coverage: 80 }
#    checked_at: [verify]
#    # Coverage is a floor, never a target - a high coverage number is a side effect of test discipline, not its goal.

# -----------------------------------------------------------------------------
# Cross-cutting: the conflict rule (a guardrail beats a strategy) and the
# Definition of Ready / Definition of Done checklists are governance too, but
# they live where they are used - see governance/README.md, the foot of
# templates/requirements-review.md (DoR) and templates/verification-report.md (DoD).
# -----------------------------------------------------------------------------
