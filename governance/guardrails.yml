# =============================================================================
# Compass — guardrails.yml
# =============================================================================
# THE MACHINE-READABLE GUARDRAIL DEFINITIONS. This file is authoritative for
# how guardrails are *checked*. `guardrails.md` explains what each guardrail is
# and why; this file says what evidence clears it, and `compass check` runs
# those checks against a task's `task.yml` and `evidence/`.
#
# Note the asymmetry, and that it is deliberate: GUARDRAILS get a .yml because
# they are checkable. STRATEGIES do not — `strategies.md` stays prose-only,
# because a strategy is *assessed* (the reviewer's judgement), not *checked*.
# That asymmetry is the guardrail/strategy distinction made physical: if a
# thing can be given a named, mechanical check, it can be a guardrail; if it
# can only be judged, it is a strategy.
#
# The five default guardrails below ship active. A project may ADD guardrails
# under `project:` — each needs a named check, or it is a strategy, not a
# guardrail. `compass policy lint` validates this file against
# schemas/guardrails.schema.json.
# =============================================================================

version: 1.0.0

# -----------------------------------------------------------------------------
# Named checks — the mechanical checks `compass check` knows how to run. Each
# guardrail below references one or more of these by name. The check reads
# task.yml and evidence/ — it does not re-run tests (that is tdd-green's job);
# it verifies the recorded state is coherent and backed by evidence.
# -----------------------------------------------------------------------------
checks:
  scenarios-have-tests:
    description: "Every scenario in task.yml lists at least one test."
  suite-passed:
    description: "evidence/green.json records the full suite passing, recently."
  changed-code-traces-to-scenario:
    description: "Every changed production file maps to >=1 scenario id."
  scenario-has-id-and-intent:
    description: "Every scenario has a stable id and a linked intent id."
  claim-traces-to-scenario:
    description: "Every claim maps to a scenario id that exists."
  gate-evidence-present:
    description: "Every gate marked pass has an evidence pointer that resolves."
  human-approval-present:
    description: "An approval record exists for an irreversible change."
  backfills-paid:
    description: "task.yml's backfills list is empty or every item is marked paid."
  spike-conclusion-present:
    description: "A Spike has a `spike-conclusion` evidence entry with a recorded decision (discard | graduate-to-delivery | defer); graduate-to-delivery links the next task."
  spike-no-production-changes:
    description: "A Spike's `changed_files` is empty — a spike ships nothing; graduating to delivery is a fresh Frame, not a merge."
  dod-evidence-typed:
    description: >
      Every unchecked DoD box in verification-report.md must carry an inline
      tag: `(evidence: EV-<id>)` referencing a typed evidence registry entry,
      or `(backfill: BF-<id>)` referencing an owed backfill. A bare unchecked
      box fails. Checked boxes (`- [x]`) pass without a tag — the human took
      responsibility. Narrative notes (devlog 'USER TO APPLY') never count.
      Cross-task: when another task has a backfill with target_task pointing at
      this task, that backfill must be paid before this task's Land closes.
  coherence-check-passes:
    description: "compass analyze reports zero coherence findings. Gate-clearing runs write type coherence-check evidence; advisory runs write command-output and do not clear verify.analyze."

# -----------------------------------------------------------------------------
# Evidence types — what KINDS of evidence a gate can be cleared with. Without
# this, `gate-evidence-present` is circular: a gate could be marked `pass`
# pointing at a weak markdown note and still clear the mechanical check. Typing
# the evidence makes the *strength* of a gate's backing visible — and lets the
# checker demand a real mechanical capture for the gates that need one.
#
# Evidence model: task.yml has a top-level `evidence:` REGISTRY of typed
# entries (each {id, type, path, ...}); a gate's `evidence:` is a list of
# evidence ids referencing the registry. Multiple gates can share one entry.
# -----------------------------------------------------------------------------
evidence_types:
  test-run:
    description: "A recorded test execution — e.g. evidence/green.json from `compass tdd-green`. The strongest: a machine ran it."
  command-output:
    description: "Captured output of a command — a scanner, a linter, a coverage run, a `compass check` run."
  manual-review:
    description: "A recorded reviewer judgement — a code review or governance review captured in a file. Stronger than a generic artifact because it is a named review, not a stray note."
  human-approval:
    description: "A recorded human sign-off — for irreversible changes (guardrail G5). Has structured fields: approver, role, decision, timestamp, scope, conditions."
  security-review:
    description: "A recorded security review or scan result — for security-sensitive changes."
  migration-plan:
    description: "A recorded plan for a data, schema, or infrastructure migration."
  rollback-plan:
    description: "A recorded plan for reverting a change safely if it goes wrong."
  claim-review:
    description: "A recorded review of public/user-facing claims against backing scenarios — the marketer's audit trail."
  spike-conclusion:
    description: "A recorded close-out of a Spike: what was learned, a decision (discard | graduate-to-delivery | defer), and any link to the next task."
  coherence-check:
    description: "Output of compass analyze — a structured coherence findings list. Gate-clearing: zero findings. Only this type clears verify.analyze; advisory command-output entries do not."
  artifact:
    description: "A written record without a more specific type — a review note, a verification report. The weakest, by design: honest for judgement-shaped gates, never enough for a mechanical one."

# gate_evidence_requirements — which evidence types each gate will accept. A
# gate not listed here accepts any type. The point is the constrained ones:
# you cannot clear `verify.correctness` with a markdown note, because
# correctness is a mechanical fact and demands a `test-run`.
gate_evidence_requirements:
  verify.correctness: [test-run]
  verify.regression: [test-run]
  verify.security: [security-review, command-output, test-run]
  verify.governance: [command-output, manual-review, artifact]
  verify.traceability: [command-output, artifact]
  verify.claims: [claim-review, command-output, artifact]
  verify.clarity: [manual-review, artifact]       # inherently judgement — and now visibly so
  spike.conclude: [spike-conclusion]              # SPECIFIC: a generic artifact will not do
  verify.analyze: [coherence-check]              # SPECIFIC: advisory command-output does NOT clear this gate

# -----------------------------------------------------------------------------
# DEFAULT GUARDRAILS — G1–G5. Shipped active. The floor under every route.
# -----------------------------------------------------------------------------
defaults:

  - id: G1
    name: "Tested before it lands"
    statement: >
      No code reaches main without a passing automated test it traces to.
    # The red-before-green ritual is strategy S2, not this guardrail. G1 is the
    # outcome; `compass check` verifies the outcome, the hook enforces S2.
    checks: [scenarios-have-tests, suite-passed, changed-code-traces-to-scenario]
    checked_at: [verify, land]

  - id: G2
    name: "Acceptance defined before it is built"
    statement: >
      No code is written that no stated, checkable acceptance criterion
      describes. BDD scenarios (strategy S1) are the default form.
    checks: [scenario-has-id-and-intent]
    checked_at: [clarify, verify]

  - id: G3
    name: "Traceability holds"
    statement: >
      code -> acceptance criterion -> intent, and public claim -> criterion,
      maintained continuously.
    checks: [changed-code-traces-to-scenario, scenario-has-id-and-intent, claim-traces-to-scenario]
    checked_at: [clarify, build, verify, land]

  - id: G4
    name: "Evidence, not assertion"
    statement: >
      A guardrail is cleared with artifacts and command output, never a claim.
      The Definition of Done is a typed gate: every unchecked DoD box must
      reference typed evidence or a filed backfill — narrative notes never clear it.
    checks: [gate-evidence-present, dod-evidence-typed, coherence-check-passes]
    checked_at: [verify, land]

  - id: G5
    name: "A human signs off on the irreversible"
    statement: >
      A change that can lose data, move money, or breach auth or privacy gets
      an explicit human checkpoint before it lands.
    checks: [human-approval-present]
    # Only applies when the task touches irreversible surface. The routing
    # policy floors such tasks to Expedition so the checkpoint has a home.
    applies_when:
      touches_any: [auth, payments, personal-data, migrations]
    checked_at: [land]

# -----------------------------------------------------------------------------
# SPIKE GUARDRAILS — apply only on a Spike route. A Spike is intentionally
# free of the delivery guardrails (G1-G5 do not apply), but it is still
# CONTROLLED: it must conclude, and it must not silently produce production
# work. `compass check` runs these instead of the defaults on a Spike route.
# -----------------------------------------------------------------------------
spike_guardrails:

  - id: S1
    name: "Spike conclusion recorded"
    statement: >
      A Spike must record what it learned and a close-out decision: discard
      the work, graduate to delivery, or defer. Without a recorded conclusion
      a Spike is just untracked work.
    checks: [spike-conclusion-present]
    checked_at: [land]

  - id: S2
    name: "No production change from a Spike"
    statement: >
      A Spike ships nothing — its `changed_files` must be empty. Exploration
      code lives on a scratch branch; if the finding is acted on, a fresh
      Frame owns the code under a real route's guardrails. This is the safety
      model: a Spike cannot silently become delivery.
    checks: [spike-no-production-changes]
    checked_at: [land]

# -----------------------------------------------------------------------------
# PROJECT GUARDRAILS — the team adds here. Each MUST reference a named check
# (add new checks to `checks:` above, or ask the CLI maintainer to add the
# check logic). A would-be guardrail with no mechanical check is a strategy —
# put it in strategies.md instead. Leave this empty rather than padding it.
# -----------------------------------------------------------------------------
project: []
