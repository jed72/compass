# governance/signals.yml — pattern defaults for Compass mechanisms that surface
# cross-task signals (scope-bloat nudges from the stop-hook; rework detection
# from `compass rework-scan`). Schema: schemas/signals.schema.json.
#
# Projects override by editing their own copy of this file (same pattern as
# guardrails.yml and routing-policy.yml). The framework ships these defaults;
# `/compass:init` copies them into a consuming project on first use.
#
# Resolved by clarifications.md Q9 (cross-task-architectural-integrity).

version: 1.0.0

scope_bloat_phrases:
  - "more files than Plan estimated"
  - "narrow scope and spawn sibling"
  - "file deeper layer as a sibling task at Land"
  - "soften the gate"
  - "(carried to Land)"
  - "USER TO APPLY"

rework_scan:
  window_days: 14
  public_surface_patterns:
    - "/api/v[0-9]+/"
    - "pb\\."           # proto symbols
  migration_paths:
    - "migrations/*.sql"
    - "**/migrations/*.sql"
