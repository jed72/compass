# =============================================================================
# Compass v2 - the frozen vocabulary
# =============================================================================
# The single source of truth for what every v2 word means. The planned
# `compass terminology [term]` command renders these entries;
# tests/test_terminology.py enforces the bans and the ratchet.
#
# Three sections:
#   terms:   every v2 term, its exact framework meaning, and disambiguations
#   banned:  v1 vocabulary that must not appear on user-facing surfaces
#   scan:    which surfaces the house test checks, which are exempt, and
#            which still await their rename slice (pending_surfaces)
#
# Naming rule: if a term is not in common use across the industry, it does
# not ship. Recorded reading (maintainer ruling, 2026-08-07, from the
# command-rename review): the rule's intent is anti-jargon, not grammatical
# purity - an industry-standard noun like "breakdown" (work breakdown
# structure) satisfies it; an invented coinage does not. The rule governs
# renamed commands; established, unbanned names keep theirs.
#
# This vocabulary is frozen. Changing it carries the same ceremony as a
# decision record; the house test pins each ban to tuned patterns and pins
# pending_surfaces to a shrink-only baseline.
# =============================================================================

version: 2.0.0-pre14

terms:

  # --- Work hierarchy (GitHub-aligned) --------------------------------------
  initiative:
    means: >
      A body of work significant enough to need a PRD, delivered across
      multiple milestones. Owns the PRD, the design, the first-slice (80/20)
      decision, and the rollout strategy.
    github: Project
    not: "An epic - that word is dropped; one word per concept."
    related: [milestone, prd, slice]
  milestone:
    means: >
      A shippable checkpoint within an initiative: a coherent bundle of
      delivered issues with a review point. Every milestone leaves the
      system releasable.
    github: Milestone
    related: [initiative, issue]
  issue:
    means: >
      The atomic tracked unit of work: one triaged piece of work, one
      delivery approach, shipping as one PR or a small PR series. Carries a
      type, labels, and a workflow state.
    github: Issue
    not: "A 'task' - that word survives only as machine state, never prose."
    related: [sub-issue, issue-type, label, workflow-state]
  sub-issue:
    means: >
      The breakdown unit within an issue or initiative. A slice is tracked
      as a sub-issue.
    github: Sub-issue
    related: [issue, slice]
  slice:
    means: >
      An independently shippable vertical cut of a feature or initiative,
      with its own acceptance criteria and its own PR. The bar: every slice
      leaves the system releasable.
    related: [sub-issue, milestone]
  pr:
    means: The unit of landing code. Small, trunk-based PRs preferred.
    github: Pull request
    related: [issue, ship]

  # --- Issue types (what triage assigns) ------------------------------------
  issue-type:
    means: >
      The classification triage assigns to an issue: quick fix, bug fix,
      hotfix, feature, or spike. Together with labels it determines the
      delivery approach - which artifacts exist and which gates apply.
    github: Issue type
    related: [issue, triage, delivery-approach, label]
  quick-fix:
    means: >
      A small, low-risk change on familiar ground. Produces a test and a PR
      - nothing else exists for it.
    related: [issue-type]
  bug-fix:
    means: >
      A defect in existing behaviour, not live-urgent. Starts from a bug
      report; the failing reproduction test is written before the fix.
    related: [bug-report, issue-type]
  hotfix:
    means: >
      A live-incident fix, expedited: reproduce, fix, ship, then pay the
      follow-up (promote the reproduction into proper acceptance criteria;
      optional postmortem).
    related: [incident, follow-up, postmortem]
  feature:
    means: >
      A self-contained change with its own acceptance criteria that does not
      warrant a full PRD. Unqualified "feature" always means this issue
      type.
    not: "A feature file (the Gherkin artifact) - always say 'feature file'."
    related: [issue-type, feature-file]
  spike:
    means: >
      Time-boxed exploration whose output is knowledge, not shipped code.
      Records the question, the timebox, and a conclusion: discard, graduate
      (a fresh issue owns any real work), or defer. Nothing ships from a
      spike.
    related: [issue-type]

  # --- Intake artifacts -----------------------------------------------------
  technical-design:
    means: >
      The engineering plan for one issue: the approach, the design decisions
      as ADR-style notes, the governance check, and the independent work
      units. Written at the planning stage (/compass:plan) as
      technical-design.md.
    not: >
      NOT the designer's work. That is the UI contract (ui-contract.md), from
      /compass:design. `design` alone named a command, an artifact, an
      artifact kind, a CLI verb and a role, and was the only overloaded word
      in this framework with no entry here - which is how it stayed
      ambiguous. NEVER abbreviate this to TDD: in this repository TDD is
      red-green-refactor and nothing else.
    related: [technical-design, delivery-approach]
  prd:
    means: >
      Product requirements document: problem, users, goals, non-goals,
      success metrics, constraints, open questions, and the first slice (the
      80/20 cut). Iterated through review before design begins. User stories
      are welcome inside it as a format; acceptance criteria are derived
      from them.
    related: [initiative, first-slice, requirements-review]
  first-slice:
    means: >
      The 80/20 cut recorded in a PRD: the slice of an initiative that
      ships first because it delivers most of the value, with what
      deliberately waits stated beside it. Design and work breakdown
      follow the first slice, not the whole PRD.
    related: [prd, slice, initiative]
  bug-report:
    means: >
      The intake for a bug fix: observed behaviour, expected behaviour,
      reproduction steps.
    related: [bug-fix]
  incident:
    means: >
      The intake that triggers a hotfix: what broke in production, impact,
      severity. SRE sense of the word.
    related: [hotfix, postmortem]

  # --- BDD (the triad, first-class) -----------------------------------------
  feature-file:
    means: >
      A Gherkin file grouping the scenarios for one capability (the
      `Feature:` keyword). The extraction target for executable acceptance
      criteria.
    not: "The feature issue type - unqualified 'feature' means the issue type."
    related: [scenario, step, acceptance-criteria]
  assessment:
    means: >
      The four-dimension judgement triage produces - risk, familiarity, size
      and goal, plus the domain labels. It is the only judgement field in the
      issue spine; everything below it is computed from it deterministically.
    not: >
      A choice of process. The assessment is read; the delivery approach is
      computed from it by `compass approach evaluate`.
    related: [triage, delivery-approach, navigator]
  traceability:
    means: >
      The chain that makes a change accountable: code traces to a TRC- id,
      which traces to an INT- id. Maintained as the work happens, not
      reconstructed at the end. It is one of the five guardrails, and the
      thing the `TRC-` prefix is named after.
    not: >
      A report produced at the end. A chain assembled after the fact records
      what someone remembered, not what happened.
    related: [scenario, intent, acceptance-criteria]
  intent:
    means: >
      Two related things, and the entry covers both deliberately. (1) The
      document: intent.md, the originator's statement of what is wanted and
      why, AUTHORED at the intake stage or INGESTED from a brief that already
      exists - it does not presume authorship. (2) The goal it carries: the
      outcome a change is meant to produce, the "why" end of the traceability
      chain, carrying the INT- ids that scenarios trace back to. The document
      holds the goals, which is why one name serves both.
      Sourced from intent.md's desired outcome, the UI
      contract, or the issue description. A goal, not a requirement: the
      functional requirement is the scenario.
    also: The product owner's entry point, `/compass:intent`, captures it.
    not: >
      A restatement of the request. "Add a CSV export" is a request; "let
      finance self-serve" is the intent, and it may need filters and
      permissions the request never mentioned.
    related: [prd, scenario, traceability]
  navigator:
    means: >
      The agent that runs triage: reads the four assessment dimensions, hands
      them to the CLI, and writes the delivery-approach record. It assesses;
      it does not choose a process.
    not: >
      A decision-maker about ceremony. The approach is computed from the
      assessment by `compass approach evaluate`, which is the determinism
      boundary.
    related: [triage, assessment, delivery-approach]
  scenario:
    means: >
      The atomic unit of acceptance: one behaviour, one Given/When/Then,
      one executable test. Everything traces to scenarios.
    related: [feature-file, step, acceptance-criteria]
  step:
    means: >
      A single Given/When/Then line, bound to a step definition in the
      project's codebase.
    related: [scenario]
  acceptance-criteria:
    means: >
      The collective term: the set of scenarios for an issue. Executable
      where a BDD runner is configured.
    related: [scenario, definition-of-done]

  # --- Design artifacts ------------------------------------------------------
  design-doc:
    means: >
      The high-level design (HLD): approach, system context, components,
      interfaces, data model, cross-cutting concerns - with sequence
      diagrams, named design patterns, and illustrative code where they add
      clarity.
    also: HLD
    related: [lld, adr, operability]
  lld:
    means: >
      Low-level design: optional per-component detail on initiative-scale
      work only. Empty is a valid state.
    related: [design-doc]
  adr:
    means: >
      Architecture decision record: one real decision, the alternatives
      considered, the consequences. Only written when there was a decision.
    related: [design-doc]

  # --- Process & gates --------------------------------------------------------
  triage:
    means: >
      Sizing up incoming work: risk, size, familiarity, urgency - producing
      an issue type, labels, and a delivery approach. The human judgement
      step; everything after it is mechanism.
    related: [delivery-approach, label, issue-type]
  delivery-approach:
    means: >
      The chosen shape for an issue: which artifacts exist, which gates
      apply, solo or parallel. Deterministic - same triage plus same policy
      always gives the same approach.
    related: [triage, quality-gate]
  guardrail:
    means: >
      A hard rule cleared with evidence; a failed guardrail stops the work.
      Few by design. Plain statement of the five: every change lands with a
      passing test that covers it; acceptance criteria exist before the code
      is written; every change traces to a stated reason; claims need
      evidence; a human signs off on the irreversible.
    related: [strategy, quality-gate, evidence]
  strategy:
    means: >
      A strong default you can step off with a recorded reason. Assessed by
      a reviewer, never mechanically blocking. TDD and BDD are strategies;
      the outcomes they serve are guardrails.
    related: [guardrail]
  quality-gate:
    means: >
      A check that must pass before an issue moves state. Which gates apply
      depends on the issue type and labels.
    related: [workflow-state, definition-of-ready, definition-of-done]
  definition-of-ready:
    means: >
      The gate between requirements and design/build: acceptance criteria
      exist, ambiguities resolved, PRD reviewed where one exists. Trivially
      satisfied for a quick fix.
    also: DoR
    related: [quality-gate, workflow-state]
  requirements-review:
    means: >
      The review pass that hardens requirements before design or build:
      ambiguities resolved into recorded decisions, contradictions and
      gaps closed, the PRD reviewed where one exists. Satisfying it is
      what makes an issue ready. v1 called this "Clarify".
    related: [prd, definition-of-ready, acceptance-criteria]
  definition-of-done:
    means: >
      The gate before shipping: acceptance criteria pass, applicable
      guardrails clear, every box backed by evidence.
    also: DoD
    related: [quality-gate, evidence]
  evidence:
    means: >
      A recorded, typed artifact that clears a gate: a test run, a review, a
      sign-off. A claim without evidence clears nothing.
    related: [guardrail, definition-of-done]
  follow-up:
    means: >
      Work owed after an expedited ship (the hotfix's promoted scenario, the
      optional postmortem). Tracked with a state pair: outstanding (not yet
      discharged) and resolved. An issue with an outstanding follow-up does
      not fully close; `compass follow-up resolve` discharges one.
    not: "v1 called this a 'backfill', with states 'owed' and 'paid'."
    related: [hotfix, backlog]

  receipt:
    means: >
      The per-issue proof summary rendered from the spine and the evidence
      registry: the assessment, the delivery approach, the gates and what
      cleared them - one screen, shareable as-is.
    not: >
      Evidence - evidence is the typed records that clear gates; the
      receipt is the read-only summary that cites them.
    related: [evidence, quality-gate]

  # --- Workflow ---------------------------------------------------------------
  workflow-state:
    means: >
      The fixed semantic lifecycle Compass owns: backlog, ready,
      in-progress, in-review, done. Gates attach to the transitions;
      transitions are earned (evidence), not dragged. Board columns are a
      user-defined projection - every custom column maps to exactly one
      state.
    related: [quality-gate, board-column, blocked]
  board-column:
    means: >
      A user-defined view column (Design, UAT, Staging...). Maps to exactly
      one workflow state so gates keep firing regardless of board shape.
    github: Project column / status field
    related: [workflow-state]
  blocked:
    means: >
      A flag, not a state - an issue is blocked while in-progress or
      in-review. Carries a reason.
    related: [workflow-state]
  backlog:
    means: >
      Two senses, both standard: the workflow state an issue starts in, and
      the list of deferred slices and follow-ups. Context disambiguates,
      as it does on every real team.
    related: [workflow-state, follow-up]

  # --- Labels ------------------------------------------------------------------
  label:
    means: >
      A plain-word tag on an issue carrying classification and risk surface.
      Local-first (strings in the issue file); synced 1:1 with GitHub labels
      when connected. Labels never track workflow state.
    github: Label
    related: [label-rule, issue]
  label-rule:
    means: >
      The deterministic consequence of a label, declared in policy:
      security/payments/personal-data/migration require a security review;
      user-facing requires a rollout plan; breaking-change requires human
      sign-off; ops-surface requires the operability section. Triage
      suggests labels, the human confirms; the rules then apply
      mechanically.
    related: [label, quality-gate]

  # --- Ship & operate ------------------------------------------------------------
  ship:
    means: >
      Merging and releasing the change: the PR lands, follow-ups are
      recorded, the derived system spec accretes. v1 called this "Land".
    related: [pr, rollout-plan]
  rollout-plan:
    means: >
      How the change reaches users safely: feature flags, canary or
      incremental rollout, and the rollback plan. Required by label rule on
      user-facing work; always present on initiatives.
    related: [feature-flag, canary, rollback-plan]
  feature-flag:
    means: A runtime switch decoupling deploy from release.
    related: [rollout-plan]
  canary:
    means: Releasing to a small slice of traffic/users first, watching SLIs.
    related: [rollout-plan, sli]
  rollback-plan:
    means: The recorded way back if the change misbehaves in production.
    related: [rollout-plan]
  operability:
    means: >
      The design section answering "what tells us this works in
      production?": the SLIs/SLOs the change affects, the alerts that watch
      them, runbook updates where the ops surface changes. Required by the
      ops-surface label rule; always present on initiatives.
    related: [sli, slo, runbook]

  # --- SRE ---------------------------------------------------------------------
  sli:
    means: >
      Service level indicator - a measured signal of service health
      (latency, error rate, availability).
    related: [slo, operability]
  slo:
    means: >
      Service level objective - the target an SLI must meet. Implies an
      error budget.
    related: [sli, error-budget]
  error-budget:
    means: >
      The unreliability an SLO allows. Paces rollout speed on initiatives:
      budget spent means slow down.
    related: [slo, rollout-plan]
  postmortem:
    means: >
      Blameless incident review - an optional follow-up artifact on a
      hotfix.
    related: [incident, follow-up]
  runbook:
    means: >
      Operational how-to for the service. Updated as an initiative-scale
      output when the ops surface changes.
    related: [operability]
  dora-metrics:
    means: >
      Lead time, deployment frequency, change failure rate, MTTR - what the
      process-impact telemetry measures to ask whether the process itself
      pays off.
    related: [retrospective-signal]
  retrospective-signal:
    means: >
      Compass's cross-issue self-check: is triage consistently over- or
      under-sizing the process? Advisory, surfaced in retro language. v1
      called this "calibration".
    related: [dora-metrics, triage]

# =============================================================================
# BANNED v1 VOCABULARY - the house test scans user-facing surfaces for these.
# Each ban is pattern plus context, never a bare word: the context note here
# is the intent, and the tuned, executable patterns live in
# tests/test_terminology.py beside the fixtures that prove them.
# =============================================================================
# =============================================================================
# CODES - the id prefixes that appear in artifacts
# =============================================================================
# `terms:` above defines the words. This defines the short codes a reader
# actually meets: TRC-A1 in a spec, EV-003 in a spine, RP-FLOOR-001 in a
# delivery-approach record. Until 3.0.0 there was nowhere to look any of them
# up. See ADR-016.
#
# docs/glossary.md is DERIVED from this section and from terms: above. Edit
# here; the page is regenerated at ship and a drift guard fails the build if
# the two disagree.
#
# The set is not maintained by hand: a guard scans shipped artifacts for
# prefixes and requires an entry for each one it finds, so a new prefix
# introduced without a definition fails on arrival.
# A CHECK DERIVES FROM THIS BLOCK'S STRUCTURE.
# tests/plain_language_check.py reads each entry's `means:` to know what plain
# words count as explaining that prefix. Rename the block or the field and the
# derivation fails loudly, naming this file. It is deliberately not a
# hand-written table elsewhere: that would drift from this block in silence,
# and the check would keep passing while describing codes that had been
# renamed. See TRC-C9 in plain-language-3-2-0.

codes:
  TRC:
    means: >
      Traceability id. The join key of the traceability chain: code traces to
      a TRC- id, which traces to an INT- id. It names the chain, not one node
      on it - changed_files, claims, evidence records and Definition-of-Done
      tags all point at it.
    referent: The traced item, normally a scenario.
    appears_in: [acceptance-criteria.md, "task.yml scenarios[].id"]
    related: [INT, EV, SCN]
  SCN:
    means: >
      The retired spelling of TRC-. Still present in shipped examples and
      read wherever TRC- is. TRC- is canonical because the parser's anchor is
      the literal keyword `traceability id:`, and because SCN- presumes every
      traced item is a Given/When/Then - a non-functional requirement can be
      traceable and testable without being a scenario.
    referent: The traced item. Same referent as TRC-.
    appears_in: [examples/]
    related: [TRC]
  INT:
    means: >
      Intent id. The "why" end of the traceability chain - the outcome the
      work is meant to produce, sourced from the PRD's desired outcome, the
      UI contract, or the issue description. A goal, not a requirement; the
      requirement is the scenario.
    referent: A stated desired outcome.
    appears_in: [prd.md, acceptance-criteria.md, "task.yml scenarios[].intent"]
    related: [TRC, prd]
  EV:
    means: >
      Evidence id. Identifies one typed record in the issue's evidence
      registry that clears a quality gate. One record can clear several
      gates. The accepted types are fixed by guardrails.yml; a gate that
      requires a mechanical type cannot be cleared with a written note.
    referent: One typed evidence record.
    appears_in: ["task.yml evidence[].id", "gates[].evidence", verification-report.md]
    related: [quality-gate, evidence]
  FU:
    means: >
      Follow-up id. Ceremony this issue owes after an expedited ship - the
      hotfix's promoted scenario, a de-scoped artifact. Not "any outstanding
      work": a newly found defect gets its own issue named by slug. A
      follow-up may carry target_task, naming the issue whose ship it blocks.
    referent: One outstanding piece of ceremony this issue owes.
    appears_in: ["task.yml follow_ups[].id", verification-report.md]
    related: [follow-up, definition-of-done]
  BF:
    means: >
      The retired spelling of FU-. Still read by the Definition-of-Done tag
      parser so archived verification reports keep resolving.
    referent: A follow-up. Same referent as FU-.
    appears_in: [".compass/work/ (archive)"]
    related: [FU]
  DD:
    means: >
      Design decision. Numbered within one design.md: what was chosen, what
      was rejected, and why. A decision with no alternative recorded is not
      yet a decision.
    referent: One decision inside a single issue's design.
    appears_in: [design.md]
    related: [ADR, design]
  ADR:
    means: >
      Architecture decision record. A DD- promoted to a standing decision
      about the system rather than about one issue - it outlives the issue
      and constrains later ones.
    referent: One numbered file under architecture/decisions/.
    appears_in: [architecture/decisions/]
    related: [DD]
  CLM:
    means: >
      Claim id. A public statement the product marketer intends to make.
      Every claim must trace to a passing scenario before the issue ships;
      the claims gate blocks on it.
    referent: One planned public claim.
    appears_in: [positioning.md, launch-readiness.md, "task.yml claims[].id"]
    related: [TRC, launch-readiness]
  PX:
    means: >
      Position exemption. One entry in `scan.position_exemptions` naming a
      position the vocabulary scan does not read - a source comment, a machine
      key - together with the reason a string in that position cannot reach a
      user. The scan reads every position by default, so a PX- entry is the
      only way a position is excluded.
    not: >
      A surface exemption. `scan.exempt` names whole FILES the scan skips; a
      PX- entry names a POSITION within a file that is scanned.
    referent: >
      One position exemption: the positions it names, and the reason a
      string there cannot reach a user.
    appears_in: governance/terminology.yml, tests/test_terminology.py
  RP:
    means: >
      Routing policy rule. One rule in routing-policy.yml that biases or
      constrains the computed delivery approach. RP-SHAPE and RP-ADV are
      soft - they bias the candidate. RP-FLOOR, RP-CAP, RP-GATE and RP-ROLE
      are hard - they constrain the result. RP-REQUIRE attaches a gate
      without raising a minimum.
    not: >
      A guardrail. `guardrail` means one of the five hard rules cleared with
      evidence; a routing rule constrains which delivery approach you end up
      with. The prefix said RG- until 3.0.0, which is why this distinction
      needs stating.
    referent: One rule in the routing policy.
    appears_in: [routing-policy.yml, delivery-approach.md, "task.yml policy_rules_fired[].id"]
    related: [routing-policy, delivery-approach, guardrail]
  RG:
    means: The retired spelling of RP-. Kept in archived records, which keep the id that fired.
    referent: A routing policy rule. Same referent as RP-.
    appears_in: [".compass/work/ (archive)"]
    related: [RP]
  RS:
    means: The retired spelling of RP- for the soft rules. Same replacement, same reason.
    referent: A routing policy rule. Same referent as RP-.
    appears_in: [".compass/work/ (archive)"]
    related: [RP]

banned:
  - term: "Frame / the Needle"
    replacement: assess
    context: "As stage/agent name and command. The command is /compass:assess; /compass:frame was removed at the v2 major version. Points at the FINAL name, not at `triage` - `triage` is itself retired now, and a ban naming a banned replacement sends a reader to a word they must rename again. 'frame' as an ordinary verb is fine."
  - term: "Triage"
    replacement: assess
    context: "As the stage name and command. The stage produces an `assessment:` block, the flag is --assessment and the policy section is assessment_vocabulary - a command called triage producing an assessment is the defect this replaced. Triage also means sorting BETWEEN cases by urgency, which is what `compass flow` does, not this stage. The command is /compass:assess; /compass:triage is a redirect stub for one major version. 'triage' as an ordinary verb, about sorting between things, is fine."
  - term: "Wireframe"
    replacement: design
    context: "As the designer's command. The designer's entry point is /compass:design again - it held that name before, and 'design' reads as UI work to most people. /compass:wireframe is a redirect stub for one major version. 'wireframe' as an ordinary noun is fine."
  - term: "reading / readings"
    replacement: assessment
    context: "As the four-dimension judgement. Ordinary uses of the word are fine."
  - term: "route"
    replacement: delivery approach
    context: "As the computed process shape (route.md, route evaluate)."
  - term: "Express"
    replacement: quick fix
    context: "Route name."
  - term: "Expedition"
    replacement: initiative
    context: "Route name."
  - term: "Specify / Clarify / Distribute / Land"
    replacement: "define acceptance criteria / requirements review / break down the work / ship"
    context: "As stage names and commands. The commands are /compass:define, /compass:refine, /compass:breakdown, /compass:ship (the planning stage's command is /compass:plan, and Build's is /compass:implement); the retired names are redirect stubs for one major version. Capitalised/heading/command usage only; ordinary verbs fine. NOTE: `plan` is NOT retired - it is the planning stage's machine key, skill (plan-authoring), agent (planner) and, since 2026-08-25, its command. A name that was retired can come back; ADR-014 removes retired names, it does not reserve them."
  - term: "PRD / prd.md"
    replacement: intent.md
    context: "As the intake document. /compass:intent writes intent.md - the command and its output had never agreed, and the ids the document sources are INT-. The wider industry name is in Anthropic's AI-Native SDLC playbook, which calls the same artifact intent.md. 'product requirements' as ordinary prose is fine."
  - term: "lens"
    replacement: role
    context: "As the role-perspective concept."
  - term: "blast radius"
    replacement: risk
    context: "As the assessment dimension (blast_radius key and prose)."
  - term: "terrain"
    replacement: familiarity
    context: "As the assessment dimension."
  - term: "magnitude"
    replacement: size
    context: "As the assessment dimension."
  - term: "touches"
    replacement: labels
    context: "As the domain-tag mechanism (touches_any, touches_common)."
  - term: "backfill"
    replacement: follow-up
    context: "All uses. The CLI verb renamed with the CLI-voice slice (compass follow-up resolve); no tolerated spelling remains."
  - term: "task"
    replacement: issue
    context: "In human-facing prose only; machine state files exempt during transition."
  - term: "G1..G5 / S1..S12 codes, bare"
    replacement: "the code followed by its plain statement, on first use"
    context: "In anything a human reads - agent speech, printed output, generated artifacts. Expand on FIRST use in that piece of output; the bare code is correct and preferable afterwards. Never drop the code: it carries the traceability the machine checks read. `compass check` is the shipped example - it prints 'G5 A human signs off on the irreversible'. Codes may live bare in governance config, which is machine input rather than something a newcomer reads."
  - term: "seam / seams"
    replacement: "interface, contract, dependency injection, boundary, extension point, abstraction layer"
    context: "For code structure, extension points and software boundaries. A vague structural metaphor lets a writer assert a structure they have not checked exists; naming the specific mechanism forces them to check. Use interface or contract for a declared Protocol, ABC or signature; dependency injection for substituting an implementation; boundary for where one package's or layer's responsibility ends; extension point for where a new implementation registers; abstraction layer when discussing decoupling. Ordinary non-structural use is fine - a garment has seams. Quoted from a tool's output, an API or an existing spec: keep it in quotation marks or a code span and say what it means, per the quoted-term exception below. Maintainer ruling, 2026-08-14."
  - term: "vacuous / vacuity / orthogonal / elide / salient"
    replacement: "everyday words, even if it takes more of them"
    context: "In anything a human reads. Each is accurate and almost never used in ordinary speech, so it costs a junior or mid engineer a lookup at the moment they are trying to read a result. Prefer a longer plain sentence to a short exact one - 'the check passed without actually checking anything' rather than 'the check cleared by vacuity'. Keep a rare word only when it is quoted from a tool's output, an API or an existing spec and the reader needs it to search; then say what it means. `canonical` is deliberately NOT on this list - it is fine in identifiers such as canonical_shape(). Maintainer ruling, 2026-08-14."
  - term: "brief.md"
    replacement: prd.md
    context: "Filename and references."
  - term: "spec.feature.md"
    replacement: "acceptance criteria (feature file)"
    context: "Filename and references."

# =============================================================================
# SCAN CONFIG - what tests/test_terminology.py checks.
# =============================================================================
scan:
  surfaces:
    - hooks/               # the enforcement path speaks to users too
    - schemas/             # a schema's description is what a validation error quotes
    - scripts/             # the shell a user runs, and what it prints
    - architecture/        # the framework's own invariants and relations
    - examples/           # shipped worked examples - what an adopter copies from
    - governance/routing-policy.yml   # comments only, per the YAML rule
    - governance/guardrails.yml
    - governance/signals.yml
    - templates/
    - commands/
    - skills/
    - cli/compass          # user-facing string literals only
    - cli/compass_pkg/     # widened at the CLI-voice slice: the user-facing
                           # strings live in the package since the module
                           # split; same string-literals-only rule
    - README.md
    - docs/five-minutes.md
    # The article written for publication - the most reader-facing prose the
    # project has, and the first document a stranger meets. Added 2026-08-15
    # once it was tracked (design decision DD-5 of plain-language-3-2-0).
    - docs/launch-article.md
    - governance/          # prose files
    - .claude-plugin/      # manifests - first prose an adopter reads
    # Session-facing instruction files, added clean (never pending): these
    # teach every agent session the register it must write, so they are
    # enforced from the day they were rewritten. In markdown surfaces the
    # scan reads prose only - fenced blocks and inline code spans are
    # machine identifiers, exempt while their referents keep v1 names.
    - CLAUDE.md
    - AGENTS.md
    - agents/            # the ten agent definitions - added clean at the
                         # skills-prose slice, never pending, same shape as
                         # the root instruction files
    # Added at the docs-prose slice, the one that emptied the pending
    # list: the delivery-approach reference docs and the remaining docs
    # prose, clean on arrival. docs/system-spec.md stays exempt below -
    # it is derived at ship time and hand-editing it is forbidden.
    - approaches/
    - docs/roles-guide.md
    - docs/safety-contract.md
    - docs/security.md
    - docs/methodology.md
    - docs/quickstart.md
    - docs/portability.md
    - docs/routing-deep-dive.md
    - docs/desired-state.md  # graduated from proposals at the 2.0.0
                              # release - an adopter surface, no longer
                              # exempt history
    # Added at the 2.1.0 release. It was never on this list, so the ratchet
    # that reached zero pending surfaces was never reading it - and it went
    # on describing v1 commands and v1 spine keys for the whole of v2. Zero
    # pending means the listed surfaces came clean, not the repository.
    - docs/install-smoke-test.md
    # Added after five published docs were found outside the list entirely.
    # docs/glossary.md is NOT among them: it is derived from this file, so it
    # is checked at its source. Hand-editing a derived page is how a derivation
    # silently stops matching, and its drift guard caught exactly that attempt.
    - docs/releasing.md
    - docs/writing-specs-and-plans.md
    - docs/receipt.md
    - docs/case-study-compass-rebuilt-itself.md
  # ---------------------------------------------------------------------------
  # POSITION EXEMPTIONS - the inverted default.
  #
  # The scan reads every position in a scanned file. Three positions were once
  # excluded - markdown fenced blocks, Python string literals, YAML values -
  # each justified with the same sentence ("machine identifiers, not prose"),
  # and each turned out to be wrong for the same reason: a string that gets
  # printed is prose wherever it lives.
  #
  # So an exclusion is now declared here, names the positions it covers, and
  # states why a string in that position cannot reach a user. A position not
  # listed here is scanned. Adding an entry is a governance change.
  # ---------------------------------------------------------------------------
  position_exemptions:
    - id: PX-1
      positions: [source comments, python docstrings]
      reason: >
        The parser discards them, so no string here can be printed, logged or
        rendered - there is no path from a comment to a user. They are also
        where the history lives: a comment explaining that a key used to be
        called something else is the record, and banning the old name there
        would delete the explanation.
    - id: PX-2
      positions: [yaml keys, json keys, json enum values]
      reason: >
        These are the machine contract, not documentation. A spine on disk, a
        policy file and a schema all agree on them, so a rename is a migration
        with a back-compat shim rather than a text sweep. The prose that sits
        beside them - descriptions, titles, rationales - is scanned.

  exempt:
    - docs/proposals/      # history stays honest
    - docs/system-spec.md  # derived at ship time; hand-editing forbidden
    # A redirect stub's whole job is to name the retired command and point at
    # its replacement. It cannot do that without saying the retired word, and
    # it is the one surface where saying it is the service rather than the
    # defect. Same rationale as the mapping data below, and the same shape:
    # named individually, so a THIRD stub is a deliberate addition rather than
    # a silent one.
    - commands/triage.md
    - commands/wireframe.md
    - cli/migrate-map.yml  # the v1-to-v2 mapping DATA: the retired-verb
                           # pointers and the migrate tool must name v1
                           # spellings; they live here so the enforced CLI
                           # never carries one in a string literal
    - docs/analysis/
    - architecture/decisions/   # ADRs may quote v1 terms
    # Same rationale one level down, narrowly: the shipped SAMPLE decision
    # records (ADR-001..005) are history in sample form, and the README is
    # exempt only because its index names those sample files - its prose is
    # kept clean regardless. The blank form (ADR-template.md) is NOT exempt:
    # future decision records are written from it, so it is enforced. The
    # sample whose title names a v1 concept is revisited when that
    # concept's rename slice lands.
    - templates/architecture/decisions/ADR-0
    - templates/architecture/decisions/README.md
    - tests/               # the tests themselves
    - .compass/work/       # task archive
  # The ratchet: surfaces not yet renamed. A slice's DoD includes removing
  # its surface from this list; removed surfaces must stay clean forever.
  # A meta-test asserts this list only ever shrinks.
  # EMPTY since the second half of the docs-prose slice - the ratchet
  # reached zero. Every scanned surface is enforced, forever; this list
  # never grows again.
  pending_surfaces: []

# =============================================================================
# RETIRED MACHINE NAMES - the identifiers, not the prose
# =============================================================================
# `banned:` above governs what a surface *teaches*: prose, printed sentences,
# headings. This list governs what the code *uses*: spine keys, artifact
# filenames, flag spellings - names with no whitespace in them, which read as
# machine identifiers rather than as English.
#
# It exists because the prose scan could not see them. Its patterns are
# sentence-shaped (`route.md`, `route evaluate`), and the Python scan skipped
# string literals with no whitespace on the reasoning that a single token is a
# machine identifier rather than prose. That reasoning was sound for the
# surface it was written for and wrong for the one it was applied to: a bare
# `'route'` used as a dict key is exactly that shape. `compass check` printed
# a placeholder header on every run and the cross-issue board printed one on
# every row, for months, past a green scan. See ADR-015.
#
# NOT listed here: `task`. `task.yml` is still the live artifact filename and
# `dest="task"` is internal plumbing - `banned:` already says the word is
# banned in human-facing prose only, with machine state exempt. Listing it
# would flag correct code.
# =============================================================================
# How an exemption is written: per line, never by path prefix
# =============================================================================
# **A path prefix lists nothing.** That is the whole argument, and it is about
# countability rather than strictness.
#
#     grep -rn "vocabulary-scan: allow" .
#
# enumerates every per-line exemption in the repository, each carrying the
# reason someone wrote for it. A directory prefix is one line hiding an unknown
# number of instances, and nothing can report what it covers - not the scan, not
# a reviewer, not the person who added it.
#
# This is the same finding as the printed-output guard one level across: what
# was missing there was never coverage but ENUMERATION. With no list of print
# sites, nothing could report what was uncovered, so 2 commands out of 24 looked
# exactly like 24.
#
# It matters because the instinct when a check is too noisy is always to reach
# for a prefix, and a prefix is the one form of exemption that cannot be
# audited. Measured 2026-08-14: narrowing ONE prefix - the bare-codes ban's
# `governance/`, covering about five prose files - surfaced a real defect nobody
# had noticed. Two prefixes in the `exempt:` list below still hide 197 tracked
# files between them. Tracked in `path-prefix-exemptions-hide-their-contents`.
#
# So: reach for the marker first. Reach for a file list second. Reach for a
# prefix only when the directory genuinely has no scannable content, and say so.

# =============================================================================
# The quoted-term exception - when a banned word may stay
# =============================================================================
# A ban exists so a reader is not made to look something up. That reason stops
# applying when the word is not ours: if a tool's output, an API, a spec or a
# standard uses the word, the reader needs the exact string in order to search
# for it, and paraphrasing it costs them the thing the ban was protecting.
#
# So a banned word may stay when BOTH hold:
#   1. It is quoted - inside quotation marks or a code span (backticks). That
#      is how the scanners recognise it, and every ban pattern is written with
#      a lookbehind and lookahead that skip a quoted or code-spanned use.
#   2. The same sentence, or the one before it, says what it means in plain
#      words. The quotation buys the reader a search term; it does not excuse
#      the sentence from explaining itself.
#
# Both halves are required. A quoted word with no explanation is the original
# defect with punctuation around it.
quoted_term_exception:
  applies_to: every entry under `banned:`
  recognised_by: "a quotation mark or a code span around the word"
  also_required: "a plain-words statement of the meaning in the same sentence or the one before"
  why: "the reader needs the exact string to search for; paraphrasing it removes that"
  worked_example: >-
    governance/strategies.md quotes the command `git grep -n -i -E '\bseam\b'`
    when explaining that a word-boundary scan returned nothing. "seam" is banned
    and stays there, in a code span, because the sentence is about that exact
    command and a reader retyping a paraphrase would not reproduce the result.

# =============================================================================
# Project-specific additions - NOT SUPPORTED YET
# =============================================================================
# The ruling (maintainer, 2026-08-14): the everyday-words list ships as a
# default, is extendable per project, and is never replaceable. The named
# prohibitions are about plain English rather than domain vocabulary, so they
# hold in any project; a team's own words are additions. A genuine domain term
# that collides with the list is handled by the quoted-term exception above,
# never by deleting the entry.
#
# WHAT IS TRUE TODAY, which is not that:
#   - The shipped list above applies as-is. That part works.
#   - Project-specific additions are NOT SUPPORTED YET. A project-local
#     governance/ currently REPLACES the shipped defaults wholesale rather than
#     layering onto them, and only when routing-policy.yml sits beside it - so
#     there is no layer for a project's entries to be added to.
#   - Tracked in `governance-merge-not-replace`. The acceptance criterion for
#     the behaviour above travels with that issue.
#
# This section states what is true rather than what is intended, deliberately.
# Writing the end state in the present tense would be a governance file
# asserting something it has not established.
project_additions:
  supported: false
  shipped_list_applies: true
  tracked_in: governance-merge-not-replace

retired_machine_names:
  # spine keys, renamed at the v2 freeze
  - name: route
    replacement: delivery_approach
  - name: readings
    replacement: assessment
  - name: phases
    replacement: stages
  - name: reframes
    replacement: reassessments
  - name: fired_guardrails
    replacement: policy_rules_fired
  - name: backfills
    replacement: follow_ups
  # artifact filenames
  - name: route.md
    replacement: delivery-approach.md
  - name: plan.md
    replacement: design.md
  - name: spec.feature.md
    replacement: acceptance-criteria.md
  - name: clarifications.md
    replacement: requirements-review.md
  - name: brief.md
    replacement: prd.md
  # flag spellings, removed outright at the major version (ADR-014)
  - name: --task
    replacement: --issue
  - name: --reading
    replacement: --assessment

  # Files that must name these identifiers to do their job. Each is here with
  # a reason, not as a blanket path exclusion - and each is a file whose
  # SUBJECT is the rename rather than a file that merely uses it.
  #
  # ADR-015 originally said these would move into cli/migrate-map.yml as data.
  # Implementation found that wrong: the spine loader reads these tables at
  # import time, so sourcing them from a YAML file would make the thing that
  # loads YAML depend on loading YAML first. Amended there.
retired_machine_name_exempt:
  - path: cli/compass_pkg/core.py
    why: >-
      Holds the read-side rename tables (SPINE_KEY_MAP, ASSESSMENT_KEY_MAP,
      _WHEN_KEY_MAP). Every loader normalises through them, which is what lets
      the rest of the CLI speak one vocabulary while a 1.x spine still loads.
      This is the single legitimate home for a retired spine key.
  - path: cli/compass_pkg/migrate.py
    why: >-
      The migrator's in-code fallback copy of the artifact map, used when a
      tree has no framework install to read cli/migrate-map.yml from. Reading
      an old archive is translation, not a redirect (ADR-014).
  - path: cli/migrate-map.yml
    why: The translation table itself, as data.
