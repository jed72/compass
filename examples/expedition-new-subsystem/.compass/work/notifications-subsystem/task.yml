# =============================================================================
# task.yml — notifications-subsystem  (EXAMPLE: the Expedition route)
# =============================================================================
# A worked example. This is the task spine after a finished Expedition: full
# weight, every gate, a swarm across worktrees. Note two things the readings
# triggered:
#   - `touches: [migrations]` -> RG-FLOOR-003 raised the candidate from
#     standard to expedition. A routing guardrail firing, visibly.
#   - `role: product-owner` -> RG-ROLE-002 required brief.md and blocked Plan
#     until the spec was checked against it for intent fidelity.
#   - touching `migrations` also makes guardrail G5 apply: a human signs off
#     the irreversible change before Land. See the `human-approval` entry in
#     `evidence:` below.
# =============================================================================

schema_version: "1.0"
task: "notifications-subsystem"
created: "2026-03-02"

# --- the route -------------------------------------------------------------
# JUDGEMENT: the Needle's Frame readings. Magnitude is `standard` on its own —
# but it touches migrations, and that is what decides the route. See route.md.
readings:
  blast_radius: contained
  terrain: greenfield
  magnitude: standard
  intent: delivery
  role: product-owner
  touches: [migrations]

# MECHANICAL: computed by `compass route evaluate --write`. The candidate was
# `standard` (RS-SHAPE-005) — RG-FLOOR-003 raised it to expedition because the
# work touches migrations. "Domain risk overrides magnitude."
route: expedition
topology: swarm
fired_guardrails:
  - id: RG-FLOOR-003
    kind: floor
    rationale: "Domain risk overrides magnitude. A one-line auth change is not small."
    changed:
      - "route raised standard -> expedition"
  - id: RG-ROLE-002
    kind: role_rule
    rationale: "Built-the-thing-right and built-the-right-thing are different checks."
    changed:
      - "artifact 'brief.md' required"
      - "phase 'plan' blocked until: the spec has been checked against brief.md for intent fidelity"
phases:
  frame: full
  specify: full
  clarify: full
  plan: full
  distribute: swarm
  build: full
  verify: full
  land: full

# --- evidence (the registry) -----------------------------------------------
# Typed, id-tagged. The strength of each entry is honest:
#   - correctness / regression: the recorded combined test run (test-run).
#   - security: the captured scanner output (command-output).
#   - judgement-shaped gates (governance, traceability, clarity, claims): the
#     verification report (artifact).
#   - G5 sign-off: a structured `human-approval` entry with full fields. The
#     fields below (approver, role, scope, decision, timestamp, conditions)
#     are what `_check_human_approval` looks for; without them the gate
#     "human-approval-present" fails. They are not ceremony — they are what
#     makes the approval auditable: who, in what role, for exactly what scope,
#     when, and under what conditions.
evidence:
  - id: EV-T1
    type: test-run
    path: evidence/green.json
    scenario: SCN-001
  - id: EV-SEC1
    type: command-output
    path: evidence/security-scan.txt
  - id: EV-V1
    type: artifact
    path: verification-report.md
  - id: EV-A1
    type: human-approval
    path: evidence/approval-migration-0042.json
    scope: "migrations/0042_notifications.sql — additive notifications schema; irreversible forward migration on production."
    approver: "l.haddad@example.com"
    role: "engineering-lead"
    decision: approved
    timestamp: "2026-03-13T16:20:00+00:00"
    conditions:
      - "Rollback plan (0042_notifications.down.sql) included in the PR."
      - "Migration run in staging first; production cutover only after a clean staging dry-run."
      - "Migration is purely additive — no change to any existing table."

# --- gates -----------------------------------------------------------------
# Expedition's gate set: all seven review dimensions. (verify.claims is in the
# set because Expedition's shape includes it — here no marketer was in play, so
# it is satisfied trivially: there are no claims to back. The gate still exists;
# it just has nothing to check.) Each `pass` gate references registry evidence
# by id; `compass check` verifies the type is one the gate accepts.
gates:
  - id: verify.correctness
    status: pass
    evidence: [EV-T1]
  - id: verify.governance
    status: pass
    evidence: [EV-V1]
  - id: verify.traceability
    status: pass
    evidence: [EV-V1]
  - id: verify.regression
    status: pass
    evidence: [EV-T1]
  - id: verify.security
    status: pass
    evidence: [EV-SEC1]
  - id: verify.clarity
    status: pass
    evidence: [EV-V1]
  - id: verify.claims
    status: pass
    evidence: [EV-V1]

# --- scenarios (filled by Specify) -----------------------------------------
# Grouped by independence — group A (delivery + dispatch) and group B
# (preferences) became the two swarm streams. See distribution-map.md.
scenarios:
  - id: SCN-001
    title: "An in-app event produces a notification for the target user"
    intent: INT-1
    tests:
      - "tests/notifications/test_dispatch.py::test_event_creates_notification"
  - id: SCN-002
    title: "A notification is delivered once, even if the event is retried"
    intent: INT-1
    tests:
      - "tests/notifications/test_dispatch.py::test_delivery_is_idempotent"
  - id: SCN-003
    title: "Notifications survive a worker restart"
    intent: INT-2
    tests:
      - "tests/notifications/test_dispatch.py::test_durable_across_restart"
  - id: SCN-004
    title: "A user mutes a category and stops receiving that category"
    intent: INT-3
    tests:
      - "tests/notifications/test_preferences.py::test_mute_category"
  - id: SCN-005
    title: "A user with no saved preferences gets the safe defaults"
    intent: INT-3
    tests:
      - "tests/notifications/test_preferences.py::test_default_preferences"
  - id: SCN-006
    title: "A muted category does not suppress a security notification"
    intent: INT-3
    tests:
      - "tests/notifications/test_preferences.py::test_security_overrides_mute"

# --- changed_files (filled by Build) ---------------------------------------
changed_files:
  - path: "migrations/0042_notifications.sql"
    scenarios: [SCN-001, SCN-002, SCN-003, SCN-004]
  - path: "src/notifications/dispatch.py"
    scenarios: [SCN-001, SCN-002, SCN-003]
  - path: "src/notifications/store.py"
    scenarios: [SCN-002, SCN-003]
  - path: "src/notifications/preferences.py"
    scenarios: [SCN-004, SCN-005, SCN-006]
  - path: "src/notifications/api.py"
    scenarios: [SCN-001, SCN-004, SCN-005]

# --- claims ----------------------------------------------------------------
# No product-marketer was in play on this task — the launch is a later task.
# verify.claims is therefore satisfied trivially: no claims, nothing to back.
claims: []

# --- backfills -------------------------------------------------------------
# Expedition borrows no ceremony from the front of the pipeline — its de-scope
# ledger is empty by definition. Nothing owed.
backfills: []

# --- reframes --------------------------------------------------------------
# Empty: RG-FLOOR-003 raised the candidate at Frame (standard -> expedition),
# but that is the route evaluator firing within a single Frame, not a re-frame.
# This task was framed once and the route held.
reframes: []
