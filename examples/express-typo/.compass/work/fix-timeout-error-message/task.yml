# =============================================================================
# task.yml — fix-timeout-error-message  (EXAMPLE: the Express route)
# =============================================================================
# A worked example. This is what task.yml looks like after a finished Express
# task: tiny. Frame wrote `readings`; `compass route evaluate --write` filled
# `route`/`topology`/`phases`/`gates`; Specify added the one scenario; Build
# added the one changed file. Nothing else was needed — that is the point of
# Express.
# =============================================================================

schema_version: "1.0"
task: "fix-timeout-error-message"
created: "2026-05-04"

# --- the route -------------------------------------------------------------
# JUDGEMENT: the Needle read these during Frame. Small on every axis, on
# mapped ground — see route.md §1 for the per-dimension justifications.
readings:
  blast_radius: trivial
  terrain: brownfield-mapped
  magnitude: small
  intent: delivery
  role: engineer
  touches: []

# MECHANICAL: everything below is what `compass route evaluate --write`
# computed from the readings above + routing-policy.yml.
route: express
topology: solo
fired_guardrails: []          # no floor, cap, or role rule matched
phases:
  frame: full
  specify: light
  clarify: collapsed
  plan: collapsed
  distribute: skipped
  build: full
  verify: light
  land: light

# --- evidence (the registry) -----------------------------------------------
# A typed, id-tagged registry of every piece of evidence this task has. Gates
# reference these entries by id. Correctness is a mechanical fact (test-run);
# governance and traceability are reviewer judgement written down (artifact).
evidence:
  - id: EV-001
    type: test-run
    path: evidence/green.json
    scenario: SCN-001
  - id: EV-V1
    type: artifact
    path: verification-note.md

# --- gates -----------------------------------------------------------------
# Express's gate set: the three immovable review dimensions, one gate at Verify.
# Each `pass` gate references registry evidence by id — `compass check` verifies
# the referenced evidence is of a type the gate accepts (see governance/
# guardrails.yml `gate_evidence_requirements`).
gates:
  - id: verify.correctness
    status: pass
    evidence: [EV-001]
  - id: verify.governance
    status: pass
    evidence: [EV-V1]
  - id: verify.traceability
    status: pass
    evidence: [EV-V1]

# --- scenarios (filled by Specify) -----------------------------------------
scenarios:
  - id: SCN-001
    title: "Upload timeout reports the real cause and the real limit"
    intent: INT-1
    tests:
      - "tests/api/test_upload_errors.py::test_timeout_message_names_size_limit"

# --- changed_files (filled by Build) ---------------------------------------
changed_files:
  - path: "src/api/upload.py"
    scenarios: [SCN-001]

# --- claims / backfills ----------------------------------------------------
# Both empty: no marketer in play, no borrowed ceremony. (Approvals are no
# longer a separate section in 1.0 — they live in `evidence:` as typed
# `human-approval` entries when irreversible surface is touched. Nothing
# irreversible here, so the registry has none.)
claims: []
backfills: []

# --- reframes --------------------------------------------------------------
# Empty: this task was framed once and never re-framed.
reframes: []
