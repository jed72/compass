# =============================================================================
# TEMPLATE: task.yml  —  the machine-readable task spine
# Produced by: /compass:frame (creates it), then every later phase fills its
#              part. Lives at: .compass/work/<task-slug>/task.yml
# =============================================================================
# task.yml is the structured counterpart to the prose artifacts (route.md,
# spec.feature.md, plan.md, …). The prose is for humans; this is for the CLI.
# `compass route evaluate` reads `readings` and writes `route`/`phases`/`gates`;
# `compass check` reads the rest and verifies the guardrail checks.
#
# It is NOT extra ceremony you hand-author. Each phase's command/agent fills
# its section as a by-product of doing the phase — Frame writes the readings,
# Specify adds scenarios, Build adds changed_files, and so on. On an Express
# task this file stays tiny. `compass task lint` checks it is well-formed.
# =============================================================================

schema_version: "1.1"     # the Compass task.yml schema this file follows
                          # '1.1': added optional `status` (active|landed) and
                          #         `land_timestamp` fields (ADR-008, DD-3).
                          # '1.0' task.ymls are still valid and are treated as
                          #         status: active by the derivation walker.
task: "{{TASK_SLUG}}"
created: "{{DATE}}"
status: active            # lifecycle: active (in-flight) | landed (complete)

# --- the route -------------------------------------------------------------
# `readings` is JUDGEMENT — the Needle (an LLM or a human) produces it during
# Frame. Everything below `readings` is MECHANICAL — `compass route evaluate
# --write` computes it deterministically from `readings` + routing-policy.yml.
readings:
  blast_radius: "{{trivial | contained | cross-cutting | critical}}"
  terrain: "{{greenfield | brownfield-mapped | brownfield-unmapped}}"
  magnitude: "{{atomic | small | standard | large | product}}"
  intent: "{{delivery | exploration}}"
  urgency: "{{none | live-defect}}"          # optional; omit if none
  role: "{{engineer | product-owner | product-marketer | designer | qa}}"
  touches: []                                # domain tags: [auth, payments, …]

route: null                  # filled by `compass route evaluate --write`
topology: null               # filled by route evaluate
fired_guardrails: []          # filled by route evaluate — [{id, kind, rationale, changed}]
phases: {}                   # filled by route evaluate — {frame: full, specify: light, …}

# --- evidence (the registry) -----------------------------------------------
# A typed, id-tagged registry of every piece of evidence this task has. Built
# incrementally: `compass tdd-green --scenario SCN-... -- <cmd>` appends a
# `test-run` entry; reviews and approvals are added by their phase/agent.
# Gates below reference these entries by id — multiple gates can share one
# piece of evidence, and `compass check` verifies the *type* each gate accepts.
# Types declared in governance/guardrails.yml: test-run, command-output,
# manual-review, human-approval, security-review, migration-plan,
# rollback-plan, claim-review, spike-conclusion, artifact.
evidence: []
#  - id: EV-001
#    type: test-run
#    path: evidence/green.json
#    scenario: SCN-001
#  - id: EV-A1
#    type: human-approval
#    path: evidence/approval-auth-change.json
#    scope: "DB migration for account deletion events"
#    approver: "name@example.com"
#    role: "engineering-lead"
#    decision: approved          # pending | approved | rejected
#    timestamp: "2026-05-15T09:30:00Z"
#    conditions:
#      - "Rollback plan in PR"
#      - "Run in staging first"

# --- gates -----------------------------------------------------------------
# Seeded by route evaluate (status: pending). Each phase updates the gates it
# clears. `compass check` verifies every `pass` gate references evidence in the
# registry above, of a type that gate accepts (see governance/guardrails.yml
# gate_evidence_requirements).
gates: []
#  - id: verify.correctness
#    status: pending          # pending | pass | fail
#    evidence: []             # when status is `pass`, list of evidence ids
#                             # from the registry above:
#                             #   evidence: [EV-001]
#                             # multiple ids allowed; at least one must be of a
#                             # type this gate accepts.

# --- scenarios (filled by Specify) -----------------------------------------
# The machine-readable index of spec.feature.md. Each scenario gets a stable
# id, a linked intent id, and the test(s) that exercise it.
scenarios: []
#  - id: SCN-001
#    title: "Finance exports the month-end ledger"
#    intent: INT-1            # traces to brief.md / the Frame request
#    tests:
#      - "tests/api/test_ledger_export.py::test_excludes_drafts"

# --- changed_files (filled by Build) ---------------------------------------
# Every production file the task changes, each traced to >=1 scenario id.
# This is the code -> criterion half of guardrail G3.
changed_files: []
#  - path: "src/api/ledger_export.py"
#    scenarios: [SCN-001]

# --- claims (filled by Position — only if a marketer is in play) -----------
# Every public/marketing claim, each traced to a backing scenario id.
# This is the claim -> criterion half of guardrail G3.
claims: []
#  - id: CLM-001
#    text: "Export your month-end ledger in seconds"
#    scenario: SCN-001

# --- backfills (owed ceremony — e.g. a Hotfix's, or a de-scoped artifact) ---
# `compass check` fails while any backfill is unpaid. Land refuses to close.
backfills: []
#  - id: BF-001
#    description: "Promote the reproduction test into a real scenario"
#    status: "{{owed | paid}}"

# --- reframes (the Needle's feedback signal) -------------------------------
# Append-only. `compass route evaluate --write` adds an entry here whenever it
# computes a route that differs from the one already recorded — i.e. a
# re-frame. `compass calibration` aggregates these across all tasks: a pattern
# of "up" re-frames means the Needle is systematically under-sizing and the
# routing policy (or the Frame rubric) needs tuning. A re-frame is a normal
# event; an unexamined pattern of them is the failure.
reframes: []
#  - from_route: express
#    to_route: standard
#    reason: "Build revealed the change spanned three modules, not one."
#    date: "{{ISO date}}"
