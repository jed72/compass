[pytest]
# Compass - pytest defaults. The most important line is the addopts that
# disables plugin autoload: external pytest plugins (ddtrace, coverage,
# instrumentation) sometimes hang or take a very long time to initialise in
# clean environments. The reviewer hit exactly this on a v1 readiness pass.
# Disabling autoload here AND in `make test` is belt-and-suspenders.
testpaths = tests
# The repository root on sys.path, so two tests that import from the
# `tests` package work under a bare `pytest`. Without it the suite only
# passes when the caller exports PYTHONPATH first, which nothing says -
# so a clean checkout looks red, and `compass tdd-green -- pytest -q`
# cannot clear the regression gate, because it spawns the command
# without the caller's shell prefix.
pythonpath = .
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
