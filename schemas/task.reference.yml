# Schema reference for: .compass/work/<task-slug>/task.yml
# The machine-readable task spine. `compass task lint` enforces this.
# Notation: (required) / (optional); `type`; [enum] where the set is closed.

task:            # (required) string — the task slug, matches the directory name
created:         # (required) string — ISO date the task was framed

readings:        # (required) map — the four-dimension JUDGEMENT readings (Frame)
  blast_radius:  # (required) [trivial, contained, cross-cutting, critical]
  terrain:       # (required) [greenfield, brownfield-mapped, brownfield-unmapped]
  magnitude:     # (required) [atomic, small, standard, large, product]
  intent:        # (optional) [delivery, exploration]   — defaults to delivery
  urgency:       # (optional) [none, live-defect]        — defaults to none
  role:          # (optional) [engineer, product-owner, product-marketer, designer, qa]
  touches:       # (optional) list of strings — domain tags (auth, payments, …)

route:           # (optional until route evaluate) string — the final route name
topology:        # (optional until route evaluate) string — solo | pair | swarm | …
fired_guardrails:# (optional) list of maps {id, kind, rationale, changed[]}
phases:          # (optional until route evaluate) map of phase -> weight string

gates:           # (optional until route evaluate) list of maps:
  - id:          #   (required in entry) string — e.g. verify.correctness
    status:      #   (required in entry) [pending, pass, fail]
    evidence:    #   (optional) string — path, relative to the task dir, or null

scenarios:       # (optional until Specify) list of maps:
  - id:          #   (required in entry) string — stable id, e.g. SCN-001
    title:       #   (optional) string
    intent:      #   (required in entry) string — intent id it traces to
    tests:       #   (optional until Build/Verify) list of strings — test refs

changed_files:   # (optional until Build) list of maps:
  - path:        #   (required in entry) string — the production file path
    scenarios:   #   (required in entry) list of scenario ids it traces to

claims:          # (optional; only when a marketer is in play) list of maps:
  - id:          #   (required in entry) string
    text:        #   (required in entry) string — the public claim
    scenario:    #   (required in entry) string — the backing scenario id

approvals:       # (optional; only when guardrail G5 applies) list of maps:
  - gate:        #   (required in entry) string
    approver:    #   (required in entry) string
    status:      #   (required in entry) [pending, approved]
    timestamp:   #   (optional) string — ISO 8601
    evidence:    #   (optional) string

backfills:       # (optional) list of maps — owed ceremony:
  - id:          #   (required in entry) string
    description: #   (required in entry) string
    status:      #   (required in entry) [owed, paid]
