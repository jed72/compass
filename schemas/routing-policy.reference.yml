# Schema reference for: governance/routing-policy.yml
# The machine-readable routing policy. `compass policy lint` enforces this.
# Notation: (required) / (optional); `type`; [enum] where the set is closed.

version:               # (required) string

routing_strategies:    # (required) map - the SOFT layer; biases the candidate route
  default_shapes:      #   (required) list of maps, evaluated top to bottom:
    - id:              #     (required) string - stable id, e.g. RS-SHAPE-001
      when:            #     (required) map - match condition against the readings
      lean_toward:     #     (required) string - a route name from route_shapes
      rationale:       #     (required) string
  default_route:       #   (required) string - fallback when no shape matches
  biases:              #   (optional) list of strings - free-text tie-breakers
  role_defaults:       #   (optional) list of maps {id, when, suggest_artifact, rationale}

routing_guardrails:    # (required) map - the HARD layer; bounds the route
  floors:              #   (optional) list of maps:
    - id:              #     (required) string - e.g. RG-FLOOR-001
      when:            #     (required) map - match condition
      force_minimum_route:  # (optional) string - raise route to >= this weight
      require_phase:   #     (optional) string - force a phase to full weight
      require_skill:   #     (optional) string
      never_skip:      #     (optional) list of phase names
      rationale:       #     (required) string
  caps:                #   (optional) list of maps:
    - id:              #     (required) string - e.g. RG-CAP-001
      when:            #     (required) map
      max_worktrees:   #     (optional) integer
      forbid_route:    #     (optional) string
      rationale:       #     (required) string
  immovable_gates:     #   (optional) list of maps:
    - id:              #     (required) string - e.g. RG-GATE-001
      gate:            #     (required) string - a gate id, e.g. verify.correctness
      rationale:       #     (required) string
  role_rules:          #   (optional) list of maps:
    - id:              #     (required) string - e.g. RG-ROLE-001
      when:            #     (required) map - typically {role: <role>}
      require_artifact:#     (optional) string
      gate:            #     (optional) string - a gate id to add to the route's set
      block_phase:     #     (optional) string - phase blocked until `until`
      until:           #     (optional) string - the unblock condition
      rationale:       #     (required) string

# `when` match conditions: keys are reading names (blast_radius, terrain,
# magnitude, intent, urgency, role) with a scalar or list value (list = any-of),
# OR the special key `touches_any` with a list value (intersect with readings.touches).

reading_vocabulary:    # (required) map - the closed value sets per reading dimension
  blast_radius:        #   (required) list of strings
  terrain:             #   (required) list of strings
  magnitude:           #   (required) list of strings
  intent:              #   (required) list of strings
  urgency:             #   (optional) list of strings
  role:                #   (optional) list of strings
  touches_common:      #   (optional) list of strings - illustrative, not closed

route_shapes:          # (required) map - the machine mirror of the 5 reference routes
  <route-name>:        #   one entry per route; spike/express/standard/hotfix/expedition required
    weight:            #     (required) integer - the force_minimum_route ladder position
    phases:            #     (required) map of phase name -> weight string
    gates:             #     (required) list of gate id strings
    topology:          #     (required) string
