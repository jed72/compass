# The stage keys were renamed on 2026-08-24 - frame->assess, specify->define,
# clarify->refine, distribute->breakdown, build->implement, land->ship.
# THE KEYS WERE TRANSLATED, NOT RE-CAPTURED. Every weight is the one recorded
# at fb092c0; re-running the evaluator to regenerate this file would launder a
# real routing regression into the baseline, which is what a baseline exists
# to prevent.
- name: spike
  assessment:
    risk: trivial
    familiarity: greenfield
    size: atomic
    goal: exploration
    role: engineer
    labels: []
  expected_route: spike
  expected_phases:
    assess: light
    define: collapsed
    refine: skipped
    plan: collapsed
    breakdown: skipped
    implement: explore
    verify: conclude
    ship: graduate-or-discard
  expected_gates:
  - spike.conclude
  expected_subtask_ceiling: 1
