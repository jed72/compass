# Compass framework repo - its own CI (dogfooding).
#
# This validates the Compass framework repository itself: the repo structure,
# the governance YAML, and the CLI. It is also the live proof of the reference
# workflow in ci/github-actions.yml - a project copies that one; this is the
# framework keeping its own house in order.

name: Compass (self-check)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by SHA, with the human-readable version
      # in a comment so Dependabot can bump them. See docs/security.md on the
      # supply-chain stance - what the framework asks its consumers to do, the
      # framework's own CI does too.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the test runner and the optional JSON Schema validator
        # PyYAML travels inside the plugin (cli/vendor/yaml/); tests/conftest.py
        # resolves it the same way the CLI does, so there is nothing to install
        # for it here. jsonschema turns on full JSON Schema validation in the
        # lint commands (genuinely optional). pytest is for the test suite step
        # below.
        run: pip install jsonschema pytest

      - name: Repo structure self-check
        # scripts/validate.sh verifies the directory tree, that commands
        # reference skills/agents/templates that exist, and that the kit layer
        # is intact.
        run: bash scripts/validate.sh

      - name: CLI syntax
        run: python3 -c "import ast; ast.parse(open('cli/compass').read())"

      - name: Compass gate suite
        # The framework repo has no .compass/work/ tasks, so this is
        # `compass policy lint` in practice - it proves the shipped governance
        # YAML is valid and the CLI runs.
        run: python3 cli/compass ci

      - name: Test suite
        # `compass ci` above checks governance and per-task guardrails; it does
        # not run the tests. Without this step nothing in tests/ gates a merge,
        # including the release invariants that cap the guardrail count and the
        # house-style guards. Plugin autoload is disabled for the same reason
        # `make test` disables it: third-party pytest plugins sometimes hang on
        # a clean machine. Runs last because it is the slowest step, so the
        # cheaper checks above fail first.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # The BDD reference adapter, in its own job and its own environment.
  #
  # pytest-bdd is a pytest PLUGIN, and the self-check job above deliberately
  # runs with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 - third-party plugins sometimes
  # hang on init in a clean environment. Under that setting pytest-bdd never
  # loads, so the adapter test would skip, forever, and a permanently-skipped
  # test is a green tick over an assertion nobody ran.
  #
  # So the adapter gets a job where autoload is ON and pytest-bdd is installed,
  # while the main suite keeps its three dependencies and its autoload-off
  # setting. Both properties are asserted by tests/test_bdd_adapter_reference.py.
  # ---------------------------------------------------------------------------
  bdd-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the test tooling and the BDD runner
        run: pip install pytest pytest-bdd

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/pytest-bdd
        run: python3 ../../../cli/compass bdd extract --task reset-password

      - name: Run the extracted scenarios
        # No PYTEST_DISABLE_PLUGIN_AUTOLOAD here, on purpose: pytest-bdd must
        # load for the scenarios to be collected at all.
        working-directory: examples/bdd-adapters/pytest-bdd
        run: python3 -m pytest tests/ -v

      - name: Prove the adapter ran rather than skipped
        # Belt and braces: if pytest-bdd ever fails to load, collection returns
        # zero scenarios and pytest exits 5. Catch that here rather than
        # reading a green tick that means nothing.
        working-directory: examples/bdd-adapters/pytest-bdd
        run: |
          python3 -m pytest tests/ -q --collect-only > /tmp/collected.txt
          grep -q "test_" /tmp/collected.txt || {
            echo "No scenarios were collected - pytest-bdd did not load."; exit 1; }

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and a test asserts it (TRC-B1).
  bdd-adapter-behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install the BDD runner
        run: pip install behave

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/behave
        run: python3 ../../../cli/compass bdd extract --task reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/behave
        run: behave features/

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and a test asserts it (TRC-B1).
  bdd-adapter-cucumber-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install the runner
        working-directory: examples/bdd-adapters/cucumber-js
        run: npm install --no-audit --no-fund

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/cucumber-js
        run: python3 ../../../cli/compass bdd extract --task reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/cucumber-js
        run: npx cucumber-js

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and a test asserts it (TRC-B1).
  bdd-adapter-godog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install the runner
        working-directory: examples/bdd-adapters/godog
        run: go mod download

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/godog
        run: python3 ../../../cli/compass bdd extract --task reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/godog
        run: go test ./...
