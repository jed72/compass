# =============================================================================
# The v1-to-v2 migration map - DATA, deliberately exempt from the
# vocabulary scan (scan.exempt in governance/terminology.yml).
#
# Why this file exists: the retired-verb pointers and (in its own slice)
# the `compass migrate` tool must both name v1 spellings - inside a CLI
# whose string literals are scanned for exactly those spellings. The
# mapping lives here as data so the enforced code never carries a banned
# name in a literal. Established at the CLI-voice slice, before the first
# pointer landed, so the exemption never has to be retrofitted.
# =============================================================================

# Spine value renames. Read-side: the normaliser maps them on load.
# Write-side: the migrate tool (its own slice) rewrites them on disk.
values:
  # Friction categories. ADR-023 retired `ceremony`; the enum keeps single
  # tokens, so the pair became over-weight / under-weight.
  # Evidence type and check name. ADR-023 renamed the concept; six manifests
  # on disk carry the old spelling and must keep clearing their gate.
  evidence_type:
    coherence-check: consistency-check
  check_name:
    coherence-check-passes: consistency-check-passes
  friction_category:
    over-ceremony: over-weight
    under-ceremony: under-weight
  follow_up_status:
    owed: outstanding
    paid: resolved
  delivery_approach:
    express: quick-fix
    standard: feature
    expedition: initiative

# Machine shape values -> the v2 change-type names the display layer
# prints. The spine keeps the machine value; the terminal never shows it.
shape_display:
  express: quick fix
  standard: feature
  expedition: initiative
  hotfix: hotfix
  spike: spike

# v1 artifact filenames -> v2, applied inside each issue directory.
# The migration module consumes this section; the copy it keeps in code
# is only the fallback for a tree with no framework install.
artifacts:
  # The issue's own record. `spine` was a metaphor the framework had to teach;
  # `manifest` is what package.json and a Kubernetes manifest already are.
  # Files written as task.yml keep loading - that is what this row is for.
  task.yml: manifest.yml
  brief.md: intent.md
  spec.feature.md: acceptance-criteria.md
  route.md: delivery-approach.md
  clarifications.md: requirements-review.md
  plan.md: technical-design.md      # v1 name, two renames ago
  design.md: technical-design.md    # v2 name, renamed 2026-08-25
  prd.md: intent.md
  spec.feature: acceptance-criteria.feature

# Stage keys. The one set of renames this map never covered, which is why they
# were never migrated: `frame` was banned as a phase name at the v2 freeze and
# survived here as a live machine key for months, because governance/*.yml is
# not a scanned surface.
#
# `plan` and `verify` are DELIBERATELY ABSENT. `verify` already agrees. `plan`
# stays because the command moves TO it - and note the `artifacts:` section
# above records `plan.md: technical-design.md`, so the engineering document
# was called `plan.md` in v1 and `design.md` in v2. A later reader will see the word circling this stage and may
# take the key for a vestige. It is not: `plan-authoring` and `planner` were
# named deliberately at v2, and the command joins them.
stage_keys:
  frame: assess
  specify: define
  clarify: refine
  distribute: breakdown
  build: implement
  land: ship

# Gate ids. `verify.fitness` is printed by `compass check` on every run, so it
# is a surface a reader learns the vocabulary from, not private plumbing -
# which is why ADR-023 renamed it with the concept rather than leaving it.
# Roughly a hundred archived manifests carry the old id.
gate_ids:
  verify.fitness: verify.architecture

# Manifest keys renamed by ADR-023, to the words Anthropic's platform docs use.
# The read side applies these through core.SPINE_KEY_MAP; this section is the
# data a reader and the migration tool share.
manifest_keys:
  topology: orchestration
  stream_ceiling: subtask_ceiling

# `.compass/config.yml` block names. This is the one vocabulary file an adopter
# edits by hand, so their existing spelling is read rather than required to
# change.
config_keys:
  swarm: multiagent
