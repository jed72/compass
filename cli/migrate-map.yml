# =============================================================================
# The v1-to-v2 migration map - DATA, deliberately exempt from the
# vocabulary scan (scan.exempt in governance/terminology.yml).
#
# Why this file exists: the retired-verb pointers and (in its own slice)
# the `compass migrate` tool must both name v1 spellings - inside a CLI
# whose string literals are scanned for exactly those spellings. The
# mapping lives here as data so the enforced code never carries a banned
# name in a literal. Established at the CLI-voice slice, before the first
# pointer landed, so the exemption never has to be retrofitted.
# =============================================================================

# Spine value renames. Read-side: the normaliser maps them on load.
# Write-side: the migrate tool (its own slice) rewrites them on disk.
values:
  follow_up_status:
    owed: outstanding
    paid: resolved
  delivery_approach:
    express: quick-fix
    standard: feature
    expedition: initiative

# Machine shape values -> the v2 change-type names the display layer
# prints. The spine keeps the machine value; the terminal never shows it.
shape_display:
  express: quick fix
  standard: feature
  expedition: initiative
  hotfix: hotfix
  spike: spike

# v1 artifact filenames -> v2, applied inside each issue directory.
# The migration module consumes this section; the copy it keeps in code
# is only the fallback for a tree with no framework install.
artifacts:
  brief.md: prd.md
  spec.feature.md: acceptance-criteria.md
  route.md: delivery-approach.md
  clarifications.md: requirements-review.md
  plan.md: design.md
  spec.feature: acceptance-criteria.feature
