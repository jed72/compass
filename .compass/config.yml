# Compass - per-project configuration
# Copied into a project by `/compass:init` (which is optional - the shipped
# governance/ defaults apply with zero setup).
#
# AUTHORITATIVE GOVERNANCE LIVES IN governance/, NOT HERE.
#   - governance/routing-policy.yml - the machine-readable routing policy:
#     route shapes, default_shapes, floors, caps, immovable_gates, role_rules.
#     `compass route evaluate` runs this. It is the single source of truth for
#     how a route is composed and constrained.
#   - governance/guardrails.yml - the machine-readable guardrail checks.
#     `compass check` runs this.
# This file holds only genuine PROJECT KNOBS - things routing-policy.yml has no
# opinion on. Routing rules are deliberately NOT duplicated here: a value in
# two places is a value that drifts.

version: 1.0.0

# --- adoption mode ----------------------------------------------------------
# How strictly Compass enforces. Start in `advisory` to pilot Compass without
# delivery friction; switch to `enforced` once the team is ready.
#   advisory : compass check / compass ci report every failure clearly, but
#              return exit 0 - they DO NOT block. Every report banner says
#              "[mode: advisory]" so nobody mistakes it for enforced.
#   enforced : compass check / compass ci return non-zero on any failure -
#              the gate is real.
# The default for a project that has not run /compass:init is `enforced`. A
# project that opts in to `advisory` does so deliberately, and it shows.
mode: enforced

# --- governance drift -------------------------------------------------------
# `compass policy lint` compares this project's governance/ against the
# framework's shipped copy and reports rules and checks the project is missing.
# It is ADVISORY by default: an adopter should not get a red build merely for
# being behind. Set `strict` once the drift is cleaned up, and `compass ci`
# will fail on any that reappears. A deliberate omission belongs under
# `routing_guardrails.waived:` with a reason, not here.
governance_drift: advisory

# --- what counts as production code -----------------------------------------
# Adds to the built-in set `hooks/pre-tool.sh` enforces (application source,
# Terraform, SQL, Dockerfiles, CI workflows, k8s/helm/migration paths). Listing
# a glob here means "a change to this needs a failing test on record first".
#
# It only ever ADDS. There is no key HERE that removes framework enforcement -
# project rules ratchet up, the same way a project guardrail may exceed a floor
# but never fall short of one. That rule is about this `enforcement:` block.
# `allow_project_commands` below is the one setting in this file that gates a
# check rather than adding one, and it is not an exception to the rule so much
# as a different thing: it decides whether Compass executes code the project
# wrote, and the answer defaults to no.
#
# This repository declares its own shell scripts, because `hooks/*.sh` and
# `scripts/*.sh` ARE the production code here: pre-tool.sh is the enforcement
# mechanism and release.sh cuts releases, and both were outside the mechanism
# they implement (ADR-011). A project that declares nothing keeps exactly the
# built-in behaviour.
enforcement:
  code_globs:
    - "hooks/*.sh"
    - "scripts/*.sh"

# --- running commands a project guardrail declares -------------------------
# A project guardrail may declare `check: command-passes`, which runs a command
# the project wrote. That is useful for architectural fitness functions and it
# is code execution, so it is off unless you say otherwise.
#
# Set this to true to run declared project commands:
# allow_project_commands: true
#
# TWO THINGS THIS SETTING IS NOT.
# It is not a security control. This file is in your repository, so a hostile
# pull request can add a command and set this key in the same diff. What it
# defends against is accidents and defaults.
# It is not the last word. Compass refuses to run project commands when the CI
# runner's environment says the contribution is untrusted, and that refusal
# reads nothing in this repository - this key is not even consulted on that
# path. See docs/security.md.
#
# With this unset, a project that declares a command is told so on every run:
# the check reports the guardrail by name, says it was not run, and is counted
# apart from the passes rather than reported green.

project:
  # The name shown in artifact headers and the devlog. In a project that has
  # run `/compass:init`, this is set to the project's own name. The value
  # below is the FRAMEWORK REPO's own - `/compass:init` copies this file into
  # a project and prompts for the project name; do not commit "Compass
  # (framework)" into your project's `.compass/config.yml`.
  name: "Compass (framework)"

  # The command Compass runs to execute the test suite. Passed to
  # `compass tdd-red`/`compass tdd-green` as the test command, and used by
  # scripts/integrate.sh for combined regression. If unset, the hooks fall
  # back to detecting npm/Make/pytest conventions.
  test_command: ""   # e.g. "npm test", "pytest -q", "go test ./..."

  # --- executable BDD (all optional) ----------------------------------------
  # `compass bdd extract` lifts the Gherkin out of a task's acceptance-criteria.md
  # into a plain .feature file, tagged with each scenario's TRC id. It works
  # with none of the keys below set - it writes the .feature into the task
  # directory and stops there.
  #
  # The keys exist for wiring that output to a real BDD runner, so the
  # scenario-to-test link becomes a fact the runner establishes rather than a
  # convention. They ship COMMENTED OUT on purpose: a project that edits
  # nothing has opted into nothing, and nothing about Compass changes.
  # See examples/bdd-adapters/ for a worked project per runner.
  #
  #   bdd_runner        Which BDD runner this project uses. Names the adapter
  #                     under examples/bdd-adapters/ that matches your setup.
  # bdd_runner: pytest-bdd        # pytest-bdd | cucumber-js | behave | godog
  #
  #   bdd_features_dir  Where `compass bdd extract` writes the .feature file.
  #                     Unset, it writes `acceptance-criteria.feature` into the task's own
  #                     directory. Set it when your runner expects a
  #                     conventional features/ directory; the file is then
  #                     written as <dir>/<task-slug>.feature.
  # bdd_features_dir: features
  #
  #   bdd_steps_dir     Where your step definitions live. Compass does not read
  #                     this; it is recorded so the runner wiring is in one
  #                     place and a reader can find both halves.
  # bdd_steps_dir: tests/steps
  #
  #   bdd_run_command   How to run the acceptance suite once the .feature is
  #                     extracted and the steps are bound.
  # bdd_run_command: pytest tests/

swarm:
  # The worktree root, relative to the project. Each stream gets a subdir.
  # The swarm/pair/solo decision and the worktree CAP are routing concerns -
  # they come from route_shapes.topology and routing_guardrails.caps in
  # governance/routing-policy.yml, not from here.
  worktree_root: "../.compass-worktrees"

artifacts:
  # Where per-task working state lives. This directory IS committed in a real
  # project - it is the audit trail, not scratch. Holds work/<task-slug>/
  # (each task's delivery-approach.md, task.yml, acceptance-criteria.md, …) and the
  # .compass/current-task pointer the CLI uses to resolve the active task.
  work_dir: ".compass/work"

roles:
  # Which role entry points are enabled for this project. All five ship
  # enabled by default - Compass treats them as full pipeline citizens.
  enabled:
    - engineer
    - product-owner
    - product-marketer
    - designer
    - qa
